<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Succès — Brevet Sprint 2027</title>
<style>
:root{--bg:#0d1418;--card:#16222a;--border:#243442;--text:#e0e6ed;--muted:#94a3b8;--blue:#38bdf8;--yellow:#fbbf24;--red:#f87171;--green:#4ade80;--violet:#a78bfa;--bois:#a97449;--argent:#c0c9d4;--legendaire:#ffd700}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(13,20,24,.95);backdrop-filter:blur(8px);z-index:10}
a{color:var(--blue);text-decoration:none;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 16px;border-radius:10px;border:1px solid var(--border);color:var(--text);font-size:.9rem;background:var(--card);font-weight:700;cursor:pointer}
.container{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:1.6rem;color:#fff;margin-bottom:8px}
h2{font-size:1.05rem;color:#fff;margin:30px 0 12px}
p.note{color:var(--muted);margin-bottom:8px;font-size:.9rem}
.progres-global{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 20px;margin:16px 0 8px;display:flex;align-items:center;gap:16px}
.progres-global .chiffre{font-size:1.6rem;font-weight:800;color:#fff}
.progres-global .barre{flex:1;height:10px;border-radius:999px;background:#0b1418;overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.6)}
.progres-global .barre-remplie{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue),var(--legendaire));box-shadow:0 0 12px rgba(56,189,248,.5)}

.grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.succes{position:relative;background:var(--card);border:2px solid var(--border);border-radius:14px;padding:16px 14px;text-align:center;transition:filter .4s ease,opacity .4s ease}
.succes .icone{font-size:1.9rem;margin-bottom:8px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.5))}
.succes .nom{color:#fff;font-weight:700;font-size:.84rem;margin-bottom:4px}
.succes .cond{color:var(--muted);font-size:.72rem}
.succes.verrouille{filter:grayscale(1);opacity:.5}
.succes.verrouille .icone::after{content:"🔒";position:absolute;top:8px;right:10px;font-size:.85rem;filter:none}

.rarete-bois.debloque{border-color:var(--bois);box-shadow:0 0 14px rgba(169,116,73,.4)}
.rarete-argent.debloque{border-color:var(--argent);box-shadow:0 0 14px rgba(192,201,212,.4)}
.rarete-legendaire.debloque{border:2px solid transparent;background-image:linear-gradient(var(--card),var(--card)),conic-gradient(from 0deg,var(--legendaire),#fff7cc,var(--legendaire));background-origin:border-box;background-clip:padding-box, border-box;box-shadow:0 0 18px rgba(255,215,0,.45);animation:tourne-succes 5s linear infinite}
@keyframes tourne-succes{0%{background-image:linear-gradient(var(--card),var(--card)),conic-gradient(from 0deg,var(--legendaire),#fff7cc,var(--legendaire))}100%{background-image:linear-gradient(var(--card),var(--card)),conic-gradient(from 360deg,var(--legendaire),#fff7cc,var(--legendaire))}}

.etiquette{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.03em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-bottom:6px}
.etiquette-bois{color:var(--bois);background:rgba(169,116,73,.15)}
.etiquette-argent{color:var(--argent);background:rgba(192,201,212,.15)}
.etiquette-legendaire{color:var(--legendaire);background:rgba(255,215,0,.15)}
.etiquette-secret{color:var(--violet);background:rgba(167,139,250,.15)}
.rarete-secret.debloque{border-color:var(--violet);box-shadow:0 0 16px rgba(167,139,250,.5)}
.rarete-royaume.debloque{box-shadow:0 0 16px color-mix(in srgb, var(--rc) 55%, transparent)}
</style>
</head>
<body>
<div class="top">
  <a class="btn" href="matieres.html">← Carte des royaumes</a>
</div>
<div class="container">
  <h1>🏆 Succès</h1>
  <p class="note">Des exploits variés à débloquer en explorant les 4 royaumes — aucun ne se perd, aucun ne se joue contre le temps.</p>

  <div class="progres-global">
    <div class="chiffre" id="compte-succes">0/21</div>
    <div class="barre"><div class="barre-remplie" id="barre-succes" style="width:0%"></div></div>
  </div>

  <div id="racine"></div>
</div>
<script>
  var idsCours = [
    'accord-participe', 'classes-mots', 'conjonctives', 'fonctions', 'homophones', 'imperatif-subjonctif', 'relatives', 'temps-composes', 'temps-simples', 'types-phrases', 'argumentatif', 'explicatif', 'lettre-formelle', 'recit', 'resumer', 'etude-recit', 'figures-style', 'poesie', 'registres', 'theatre', 'calcul-litteral', 'equations', 'fractions', 'inequations', 'nombres-relatifs', 'puissances', 'aires', 'angles-cercle', 'pythagore', 'thales', 'transformations', 'trigonometrie', 'volumes', 'proportionnalite', 'fonctions-affines', 'fonctions-lineaires', 'probabilites', 'representation-graphique', 'statistiques', 'algorithmique-scratch', 'construction-europeenne', 'france-seconde-guerre-mondiale', 'guerre-froide', 'monde-depuis-1991', 'premiere-guerre-mondiale', 'seconde-guerre-mondiale', 'totalitarismes', 'aires-urbaines', 'espaces-faible-densite', 'espaces-productifs', 'france-europe-monde', 'mobilites', 'territoires-ue', 'citoyennete', 'defense-paix', 'droits-homme', 'numerique-droits', 'valeurs-republique', 'chaine-energetique', 'conversions', 'electricite', 'energie', 'etats-matiere', 'forces', 'gravitation', 'poids-masse', 'ressources-energetiques', 'signaux-lumineux', 'signaux-sonores', 'solutions', 'transformations', 'biodiversite', 'circulation', 'contraception', 'developpement-durable', 'impact-humain', 'muscles', 'nutrition', 'reproduction-humaine', 'respiration', 'risques-naturels', 'systeme-nerveux', 'tabac-alcool-drogues', 'transmission-vie', 'analyser-objet', 'bases-programmation', 'conception', 'evolution-techno', 'impact-environnemental', 'scratch-python'
  ];

  var royaumes = [
    { nom: 'Maître des Lettres', couleur: '#4ade80', cours: ['accord-participe', 'classes-mots', 'conjonctives', 'fonctions', 'homophones', 'imperatif-subjonctif', 'relatives', 'temps-composes', 'temps-simples', 'types-phrases', 'argumentatif', 'explicatif', 'lettre-formelle', 'recit', 'resumer', 'etude-recit', 'figures-style', 'poesie', 'registres', 'theatre'] },
    { nom: 'Maître des Nombres', couleur: '#38bdf8', cours: ['calcul-litteral', 'equations', 'fractions', 'inequations', 'nombres-relatifs', 'puissances', 'aires', 'angles-cercle', 'pythagore', 'thales', 'transformations', 'trigonometrie', 'volumes', 'proportionnalite', 'fonctions-affines', 'fonctions-lineaires', 'probabilites', 'representation-graphique', 'statistiques', 'algorithmique-scratch'] },
    { nom: 'Maître du Temps', couleur: '#fbbf24', cours: ['construction-europeenne', 'france-seconde-guerre-mondiale', 'guerre-froide', 'monde-depuis-1991', 'premiere-guerre-mondiale', 'seconde-guerre-mondiale', 'totalitarismes', 'aires-urbaines', 'espaces-faible-densite', 'espaces-productifs', 'france-europe-monde', 'mobilites', 'territoires-ue', 'citoyennete', 'defense-paix', 'droits-homme', 'numerique-droits', 'valeurs-republique'] },
    { nom: 'Maître des Éléments', couleur: '#a78bfa', cours: ['chaine-energetique', 'conversions', 'electricite', 'energie', 'etats-matiere', 'forces', 'gravitation', 'poids-masse', 'ressources-energetiques', 'signaux-lumineux', 'signaux-sonores', 'solutions', 'transformations', 'biodiversite', 'circulation', 'contraception', 'developpement-durable', 'impact-humain', 'muscles', 'nutrition', 'reproduction-humaine', 'respiration', 'risques-naturels', 'systeme-nerveux', 'tabac-alcool-drogues', 'transmission-vie', 'analyser-objet', 'bases-programmation', 'conception', 'evolution-techno', 'impact-environnemental', 'scratch-python'] }
  ];

  function etapeMascotte(pct) {
    if (pct >= 66) return 3;
    if (pct >= 33) return 2;
    if (pct >= 1) return 1;
    return 0;
  }

  royaumes.forEach(function (r) {
    r.cles = r.cours.filter(function (id) { return localStorage.getItem('brevet2027_cours_' + id) === 'lu'; }).length;
    r.coffres = r.cours.filter(function (id) { return localStorage.getItem('brevet2027_exo_' + id + '_reussi') === 'oui'; }).length;
    r.complet = r.coffres === r.cours.length;
    r.etapeFinale = etapeMascotte(Math.round((r.coffres / r.cours.length) * 100)) === 3;
  });

  var cles = idsCours.filter(function (id) { return localStorage.getItem('brevet2027_cours_' + id) === 'lu'; }).length;
  var sansfaute = idsCours.filter(function (id) { return localStorage.getItem('brevet2027_exo_' + id + '_sansfaute') === 'oui'; }).length;
  var streakCompte = parseInt(localStorage.getItem('brevet2027_streak_compte') || '0', 10);
  var quetesCompletees = parseInt(localStorage.getItem('brevet2027_quetes_completees_total') || '0', 10);
  var royaumesConquis = royaumes.filter(function (r) { return r.complet; }).length;
  var royaumesAvecCoffre = royaumes.filter(function (r) { return r.coffres >= 1; }).length;
  var mascottesFinales = royaumes.filter(function (r) { return r.etapeFinale; }).length;

  var THEMES = [
    { nom: '🗝️ Progression', succes: [
      { nom: 'Premier pas', icone: '👣', rarete: 'bois', cond: '1 cours lu', debloque: cles >= 1 },
      { nom: 'Aventurier confirmé', icone: '🧭', rarete: 'argent', cond: '1 coffre dans chaque royaume', debloque: royaumesAvecCoffre === 4 },
      { nom: 'Souverain', icone: '👑', rarete: 'argent', cond: '1 royaume à 100%', debloque: royaumesConquis >= 1 },
      { nom: 'Suzerain des 4 royaumes', icone: '🏰', rarete: 'legendaire', cond: 'Les 4 royaumes conquis', debloque: royaumesConquis === 4 }
    ]},
    { nom: '⭐ Maîtrise', succes: [
      { nom: 'Perfectionniste', icone: '💎', rarete: 'bois', cond: '5 exercices sans faute', debloque: sansfaute >= 5 },
      { nom: 'Grand Maître', icone: '🎯', rarete: 'argent', cond: '25 exercices sans faute', debloque: sansfaute >= 25 },
      { nom: 'Sans-tache', icone: '✨', rarete: 'legendaire', cond: '90/90 sans la moindre faute', debloque: sansfaute === idsCours.length }
    ]},
    { nom: '🐉 Exploration', succes: [
      { nom: 'Premier compagnon', icone: '🐣', rarete: 'bois', cond: '1 mascotte forme finale', debloque: mascottesFinales >= 1 },
      { nom: 'Ménagerie complète', icone: '🐾', rarete: 'legendaire', cond: 'Les 4 mascottes forme finale', debloque: mascottesFinales === 4 }
    ]},
    { nom: '🔥 Régularité', succes: [
      { nom: 'Première flamme', icone: '🕯️', rarete: 'bois', cond: '3 jours de suite', debloque: streakCompte >= 3 },
      { nom: 'Feu ardent', icone: '🔥', rarete: 'argent', cond: '7 jours de suite', debloque: streakCompte >= 7 },
      { nom: 'Inextinguible', icone: '🌋', rarete: 'legendaire', cond: '30 jours de suite', debloque: streakCompte >= 30 }
    ]},
    { nom: '📅 Cumul de quêtes', succes: [
      { nom: 'Assidu', icone: '📅', rarete: 'bois', cond: '5 jours de quêtes complètes', debloque: quetesCompletees >= 5 },
      { nom: 'Régulier', icone: '🗓️', rarete: 'argent', cond: '20 jours de quêtes complètes', debloque: quetesCompletees >= 20 },
      { nom: 'Discipline de fer', icone: '⚙️', rarete: 'legendaire', cond: '60 jours de quêtes complètes', debloque: quetesCompletees >= 60 }
    ]},
    { nom: '👑 Maître de royaume', succes: royaumes.map(function (r) {
      return { nom: r.nom, icone: '👑', rarete: 'royaume', couleur: r.couleur, cond: r.nom.replace('Maître ', 'Royaume ') + ' conquis à 100%', debloque: r.complet };
    })},
    { nom: '🌙 Secrets', succes: [
      { nom: 'Lève-tôt', icone: '🌅', rarete: 'secret', cond: 'Réussir un exercice avant 8h', debloque: localStorage.getItem('brevet2027_badge_leve_tot') === 'oui' },
      { nom: 'Oiseau de nuit', icone: '🌙', rarete: 'secret', cond: 'Réussir un exercice après 22h', debloque: localStorage.getItem('brevet2027_badge_oiseau_nuit') === 'oui' }
    ]}
  ];

  var totalSucces = 0, totalDebloques = 0;
  var racine = document.getElementById('racine');
  THEMES.forEach(function (theme) {
    var h2 = document.createElement('h2');
    h2.textContent = theme.nom;
    racine.appendChild(h2);
    var grille = document.createElement('div');
    grille.className = 'grille';
    theme.succes.forEach(function (s) {
      totalSucces++;
      if (s.debloque) totalDebloques++;
      var etiquettes = { bois: 'Bois', argent: 'Argent', legendaire: 'Légendaire', secret: 'Secret' };
      var etiquetteHtml = etiquettes[s.rarete] ? '<div class="etiquette etiquette-' + s.rarete + '">' + etiquettes[s.rarete] + '</div>' : '';
      var div = document.createElement('div');
      div.className = 'succes rarete-' + s.rarete + (s.debloque ? ' debloque' : ' verrouille');
      if (s.couleur) div.style.setProperty('--rc', s.couleur);
      div.innerHTML =
        etiquetteHtml +
        '<div class="icone">' + s.icone + '</div>' +
        '<div class="nom">' + s.nom + '</div>' +
        '<div class="cond">' + s.cond + '</div>';
      grille.appendChild(div);
    });
    racine.appendChild(grille);
  });

  document.getElementById('compte-succes').textContent = totalDebloques + '/' + totalSucces;
  document.getElementById('barre-succes').style.width = Math.round((totalDebloques / totalSucces) * 100) + '%';
</script>
</body>
</html>
