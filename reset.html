<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Réinitialisation Brevet Sprint</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7fb;
        color: #172033;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(620px, 100%);
        padding: 28px;
        border-radius: 10px;
        background: #fff;
        border: 1px solid #dce2ea;
        box-shadow: 0 18px 40px rgba(31, 45, 61, 0.12);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2rem, 7vw, 3rem);
      }

      p {
        line-height: 1.55;
      }

      a,
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        margin-top: 14px;
        padding: 0 18px;
        border: 0;
        border-radius: 8px;
        background: #256d85;
        color: #fff;
        font: inherit;
        font-weight: 800;
        text-decoration: none;
        cursor: pointer;
      }

      .muted {
        color: #667085;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Réinitialisation</h1>
      <p id="status">Suppression de l'ancienne version en cache...</p>
      <p class="muted">Cette page sert seulement à forcer le navigateur à charger la dernière version de Brevet Sprint.</p>
      <a id="openApp" href="app-brevet/?fresh=reset">Ouvrir Brevet Sprint</a>
    </main>

    <script>
      async function resetBrevetSprint() {
        const status = document.getElementById("status");
        try {
          if ("serviceWorker" in navigator) {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.unregister()));
          }
          if ("caches" in window) {
            const keys = await caches.keys();
            await Promise.all(keys.map((key) => caches.delete(key)));
          }
          localStorage.setItem("brevetSprintResetAt", new Date().toISOString());
          status.textContent = "Ancien cache supprimé. Tu peux ouvrir Brevet Sprint.";
        } catch (error) {
          status.textContent = "La réinitialisation automatique n'a pas tout supprimé. Ouvre quand même Brevet Sprint, puis actualise si besoin.";
        }
      }

      resetBrevetSprint();
    </script>
  </body>
</html>
