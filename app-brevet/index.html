<!DOCTYPE html>

<head>

<title>Redirection — Brevet Sprint 2027</title>
<style>
:root{--bg:#0d1418;--card:#16222a;--border:#243442;--text:#e0e6ed;--muted:#94a3b8;--blue:#38bdf8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.carte{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:32px 28px;max-width:380px}
.icone{font-size:2.4rem;margin-bottom:12px}
h1{font-size:1.15rem;color:#fff;margin-bottom:10px}
p{color:var(--muted);font-size:.92rem;margin-bottom:18px;line-height:1.6}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 20px;border-radius:10px;background:var(--blue);color:#04202e;font-weight:700;text-decoration:none;font-size:.95rem}
</style>
</head>
<body>
<div class="carte">
  <div class="icone">🗺️</div>
  <h1>Ce lien a déménagé</h1>
  <p>Brevet Sprint 2027 a une nouvelle adresse. Tu vas être redirigé automatiquement dans un instant.</p>
  <a class="btn" href="https://parragaantoine.github.io/brevet-des-colleges/">Continuer vers le site →</a>
</div>
<script>location.replace('https://parragaantoine.github.io/brevet-des-colleges/');</script>
</body>
