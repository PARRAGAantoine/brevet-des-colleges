<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exercices — Algorithmique et Scratch — Brevet Sprint 2027</title>
<style>
:root{--bg:#0d1418;--card:#16222a;--border:#243442;--text:#e0e6ed;--muted:#94a3b8;--blue:#38bdf8;--yellow:#fbbf24;--red:#f87171;--green:#4ade80}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(13,20,24,.95);backdrop-filter:blur(8px);z-index:10}
a{color:var(--blue);text-decoration:none;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 18px;border-radius:10px;border:1px solid var(--border);color:var(--text);font-size:.95rem;background:var(--card);font-weight:700;cursor:pointer}
.btn-primary{background:var(--blue);color:#000;border-color:var(--blue)}
.container{max-width:720px;margin:0 auto;padding:24px 16px 60px}
.fil{color:var(--muted);font-size:.85rem;margin-bottom:6px}
h1{font-size:1.5rem;color:#fff;margin-bottom:6px}
p.note{color:var(--muted);font-size:.85rem;margin-bottom:20px}
.question{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin:16px 0}
.question h2{font-size:1rem;color:var(--blue);margin-bottom:4px}
.question p.enonce{color:#fff;font-size:1.05rem;margin-bottom:14px}
.choix{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.reponse{min-height:48px;padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);text-align:left;font-size:.95rem;cursor:pointer}
.reponse.correcte-select{border-color:var(--green);background:rgba(74,222,128,.12);color:var(--green)}
.reponse.fausse-select{border-color:var(--red);background:rgba(248,113,113,.12);color:var(--red)}
.zone-texte{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.champ-reponse{flex:1;min-width:160px;min-height:48px;padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);font-size:.95rem}
.champ-reponse:focus{outline:none;border-color:var(--blue)}
.champ-reponse.correcte{border-color:var(--green);background:rgba(74,222,128,.12);color:var(--green)}
.champ-reponse.fausse{border-color:var(--red);background:rgba(248,113,113,.12);color:var(--red)}
.btn-valider{min-height:48px;padding:10px 20px;border-radius:10px;border:1px solid var(--blue);background:var(--blue);color:#000;font-weight:700;cursor:pointer;font-size:.95rem}
.feedback{font-weight:700;margin-bottom:10px;min-height:1.2em}
.feedback.ok{color:var(--green)}
.feedback.non{color:var(--yellow)}
.aides{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.btn-aide{align-self:flex-start;min-height:48px;padding:8px 14px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--blue);font-weight:700;cursor:pointer;font-size:.9rem}
.btn-aide[data-niveau="2"]{display:none}
.aide-texte{display:none;padding:10px 14px;border-radius:8px;background:rgba(56,189,248,.08);border-left:4px solid var(--blue);color:var(--text);font-size:.9rem}
.aide-texte.visible{display:block}
.btn-voir-reponse{display:none;align-self:flex-start;min-height:48px;padding:8px 14px;border-radius:9px;border:1px solid var(--yellow);background:transparent;color:var(--yellow);font-weight:700;cursor:pointer;font-size:.9rem}
.feedback.revele{color:var(--blue)}
.reponse:disabled,.champ-reponse:disabled,.btn-valider:disabled{opacity:.7;cursor:default}
.fin{background:var(--card);border:1px solid var(--green);border-radius:14px;padding:20px;margin:20px 0;text-align:center;display:none}
.fin.visible{display:block}
.fin p{color:var(--green);font-weight:700;font-size:1.1rem;margin-bottom:14px}
.actions-bas{margin-top:24px}
@keyframes brevet-confetti{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(360deg);opacity:0}}
.fin-compte{color:var(--muted);font-size:.85rem;margin-top:8px}
.fin-actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="top">
  <a class="btn" href="../index.html">← Revoir le cours</a>
</div>
<div class="container">
  <p class="fil">Mathématiques · Algorithmique</p>
  <h1>Exercices — Algorithmique et Scratch</h1>
  <p class="note">4 nouvelles questions à chaque fois, tirées d'une banque de 20.</p>

  <div id="questions"></div>

  <div id="fin" class="fin">
    <p>Bravo, tu as réussi tous les exercices ! 🎉</p>
    <p class="fin-compte" id="fin-compte"></p>
    <div class="fin-actions">
      <button id="btn-rester" class="btn" type="button">Rester ici</button>
      <a class="btn btn-primary" href="../../../index.html">Voir ma progression maintenant →</a>
    </div>
  </div>

  <div class="actions-bas">
    <a class="btn btn-primary" href="../index.html">← Revoir le cours</a>
  </div>
</div>

<script>
  var idCours = 'algorithmique-scratch';
  var keyTente = 'brevet2027_exo_' + idCours + '_tente';
  var keyReussi = 'brevet2027_exo_' + idCours + '_reussi';
  var keySansFaute = 'brevet2027_exo_' + idCours + '_sansfaute';

  var banqueQCM = [
    { enonce: 'Qu’est-ce qu’un algorithme ?', choix: [
        { texte: 'une suite d’instructions ordonnées', correct: true }, { texte: 'un dessin', correct: false }, { texte: 'un jeu', correct: false }
      ], aide1: 'Pense à une recette de cuisine.', aide2: 'Un algorithme est une suite précise et ordonnée d’instructions pour résoudre un problème.' },
    { enonce: 'À quoi sert une boucle ?', choix: [
        { texte: 'à répéter une action', correct: true }, { texte: 'à stocker une valeur', correct: false }, { texte: 'à dessiner', correct: false }
      ], aide1: 'Pense à « répéter X fois ».', aide2: 'Une boucle permet de répéter une même action plusieurs fois sans la réécrire.' },
    { enonce: 'À quoi sert une condition (si...alors) ?', choix: [
        { texte: 'à exécuter une action seulement si quelque chose est vrai', correct: true }, { texte: 'à répéter à l’infini', correct: false }, { texte: 'à additionner', correct: false }
      ], aide1: 'Pense à un choix selon une situation.', aide2: 'Une condition permet d’exécuter une action uniquement si un test est vérifié.' },
    { enonce: 'Une variable sert à...', choix: [
        { texte: 'stocker une valeur qui peut changer', correct: true }, { texte: 'dessiner un carré', correct: false }, { texte: 'répéter une boucle', correct: false }
      ], aide1: 'Pense à un score qui évolue dans un jeu.', aide2: 'Une variable stocke une valeur (comme un score ou un compteur) qui peut changer au cours du programme.' },
    { enonce: 'Scratch est un langage de programmation...', choix: [
        { texte: 'par blocs, à assembler visuellement', correct: true }, { texte: 'uniquement écrit en texte', correct: false }, { texte: 'sans instructions', correct: false }
      ], aide1: 'Pense aux pièces de puzzle qu’on assemble.', aide2: 'Dans Scratch, on programme en emboîtant des blocs visuels les uns dans les autres.' },
    { enonce: 'Une boucle « répéter 4 fois » exécute son contenu...', choix: [
        { texte: '4 fois', correct: true }, { texte: '1 fois', correct: false }, { texte: 'à l’infini', correct: false }
      ], aide1: 'Le nombre dans la boucle indique le nombre de répétitions.', aide2: 'Le contenu de la boucle est exécuté exactement 4 fois.' },
    { enonce: 'Dans un algorithme, les instructions s’exécutent...', choix: [
        { texte: 'dans l’ordre, l’une après l’autre', correct: true }, { texte: 'dans le désordre', correct: false }, { texte: 'toutes en même temps', correct: false }
      ], aide1: 'Pense à une recette de cuisine, étape par étape.', aide2: 'Un algorithme s’exécute toujours dans l’ordre où les instructions sont écrites.' },
    { enonce: 'Pour tester une condition comme « si score>10 », on utilise...', choix: [
        { texte: 'un opérateur de comparaison', correct: true }, { texte: 'une boucle', correct: false }, { texte: 'un dessin', correct: false }
      ], aide1: 'Le symbole > compare deux valeurs.', aide2: 'Ces opérateurs (>, <, =) permettent de comparer des valeurs dans une condition.' },
    { enonce: 'Un capteur (comme « touche espace pressée ? ») sert à...', choix: [
        { texte: 'déclencher une action selon un événement', correct: true }, { texte: 'stocker une variable', correct: false }, { texte: 'dessiner un carré', correct: false }
      ], aide1: 'Pense à une réaction du programme à ce que fait l’utilisateur.', aide2: 'Un capteur détecte un événement (touche, clic...) pour déclencher une action.' },
    { enonce: 'Une boucle « répéter indéfiniment » s’arrête...', choix: [
        { texte: 'jamais (sauf arrêt du programme)', correct: true }, { texte: 'après 10 fois', correct: false }, { texte: 'après 1 fois', correct: false }
      ], aide1: 'Le mot « indéfiniment » veut dire sans fin prévue.', aide2: 'Cette boucle continue tant que le programme tourne, sans limite fixée.' }
  ];

  var banqueTexte = [
    { enonce: 'Une suite d’instructions ordonnées pour résoudre un problème s’appelle un... (un mot)', reponses: ['algorithme'], aide1: 'Pense à une recette de cuisine.', aide2: 'C’est le titre de ce chapitre.' },
    { enonce: 'La structure qui répète une action plusieurs fois s’appelle une... (un mot)', reponses: ['boucle'], aide1: 'Pense à « répéter X fois ».', aide2: 'Elle évite de réécrire plusieurs fois la même instruction.' },
    { enonce: 'La structure qui exécute une action seulement si un test est vrai s’appelle une... (un mot)', reponses: ['condition'], aide1: 'Pense à « si...alors ».', aide2: 'Elle permet de faire des choix dans un programme.' },
    { enonce: 'L’élément qui stocke une valeur qui peut changer s’appelle une... (un mot)', reponses: ['variable'], aide1: 'Pense à un score qui évolue.', aide2: 'Elle a un nom et une valeur qui peut être modifiée.' },
    { enonce: 'Une boucle « répéter 10 fois » exécute son contenu combien de fois ? (un nombre)', reponses: ['10'], aide1: 'Le nombre dans la boucle indique le nombre de répétitions.', aide2: 'C’est exactement ce nombre indiqué dans la boucle.' },
    { enonce: 'Dans Scratch, on programme en assemblant des... (un mot)', reponses: ['blocs'], aide1: 'Pense aux pièces de puzzle qu’on assemble.', aide2: 'Ces éléments visuels s’emboîtent les uns dans les autres.' },
    { enonce: 'Une variable « score » commence à 0. On lui ajoute 5, deux fois de suite. Quelle est sa valeur finale ? (un nombre)', reponses: ['10'], aide1: 'Additionne les deux ajouts successifs.', aide2: '0+5+5.' },
    { enonce: 'Une variable « compteur » commence à 3. Une boucle « répéter 4 fois » lui ajoute 1 à chaque fois. Quelle est sa valeur finale ? (un nombre)', reponses: ['7'], aide1: 'Ajoute le nombre de répétitions à la valeur de départ.', aide2: '3+4.' },
    { enonce: 'Dans « si...alors...sinon », la partie « sinon » s’exécute quand la condition est... (un mot)', reponses: ['fausse'], aide1: 'C’est l’opposé de « vraie ».', aide2: 'Le « sinon » prend le relais quand le test échoue.' },
    { enonce: 'Combien de fois s’exécute le contenu d’une boucle « répéter 6 fois » ? (un nombre)', reponses: ['6'], aide1: 'Le nombre dans la boucle indique le nombre de répétitions.', aide2: 'C’est exactement ce nombre indiqué dans la boucle.' }
  ];

  function melanger(tableau) {
    var copie = tableau.slice();
    for (var i = copie.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = copie[i]; copie[i] = copie[j]; copie[j] = tmp;
    }
    return copie;
  }

  function normaliser(s) {
    return s.trim().toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '')
      .replace(/[’`]/g, "'")
      .replace(/\s+/g, '');
  }

  function brevetJournee() {
    var j = new Date().toISOString().slice(0, 10);
    if (localStorage.getItem('brevet2027_jour_courant') !== j) {
      localStorage.setItem('brevet2027_jour_courant', j);
      localStorage.setItem('brevet2027_jour_reussites', '0');
    }
  }
  function brevetErreur() {
    var n = parseInt(localStorage.getItem('brevet2027_erreurs_total') || '0', 10);
    localStorage.setItem('brevet2027_erreurs_total', String(n + 1));
  }
  function brevetReussiteJour() {
    brevetJournee();
    var n = parseInt(localStorage.getItem('brevet2027_jour_reussites') || '0', 10);
    n = n + 1;
    localStorage.setItem('brevet2027_jour_reussites', String(n));
    if (n === 3) {
      var jq = new Date().toISOString().slice(0, 10);
      if (localStorage.getItem('brevet2027_quetes_jour_compte') !== jq) {
        localStorage.setItem('brevet2027_quetes_jour_compte', jq);
        var tq = parseInt(localStorage.getItem('brevet2027_quetes_completees_total') || '0', 10);
        localStorage.setItem('brevet2027_quetes_completees_total', String(tq + 1));
      }
    }
    var dLundi = new Date();
    var jourSemaine = dLundi.getDay();
    dLundi.setDate(dLundi.getDate() + (jourSemaine === 0 ? -6 : 1 - jourSemaine));
    var lundi = dLundi.toISOString().slice(0, 10);
    if (localStorage.getItem('brevet2027_semaine_lundi') !== lundi) {
      localStorage.setItem('brevet2027_semaine_lundi', lundi);
      localStorage.setItem('brevet2027_semaine_reussites', '0');
    }
    var ns = parseInt(localStorage.getItem('brevet2027_semaine_reussites') || '0', 10);
    localStorage.setItem('brevet2027_semaine_reussites', String(ns + 1));
  }
  function brevetConfetti() {
    var c = document.createElement('div');
    c.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden';
    document.body.appendChild(c);
    var couleurs = ['#38bdf8', '#fbbf24', '#4ade80', '#f87171', '#a78bfa', '#ffd700'];
    for (var i = 0; i < 40; i++) {
      var p = document.createElement('span');
      var coul = couleurs[Math.floor(Math.random() * couleurs.length)];
      var gauche = Math.random() * 100;
      var duree = 1.4 + Math.random() * 1.2;
      var delai = Math.random() * 0.3;
      p.style.cssText = 'position:absolute;top:-10px;left:' + gauche + '%;width:8px;height:8px;background:' + coul + ';border-radius:2px;animation:brevet-confetti ' + duree + 's ease-in ' + delai + 's forwards;opacity:0';
      c.appendChild(p);
    }
    setTimeout(function () { c.remove(); }, 3000);
  }
  function brevetSon(succes) {
    try {
      var ctx = new (window.AudioContext || window.webkitAudioContext)();
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'sine';
      o.frequency.value = succes ? 660 : 220;
      g.gain.setValueAtTime(0.08, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (succes ? 0.35 : 0.18));
      o.start();
      o.stop(ctx.currentTime + (succes ? 0.35 : 0.18));
      if (succes) {
        var o2 = ctx.createOscillator(), g2 = ctx.createGain();
        o2.connect(g2); g2.connect(ctx.destination);
        o2.type = 'sine'; o2.frequency.value = 880;
        g2.gain.setValueAtTime(0.07, ctx.currentTime + 0.12);
        g2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
        o2.start(ctx.currentTime + 0.12); o2.stop(ctx.currentTime + 0.45);
      }
    } catch (e) {}
  }

  function demarrerRetourAuto() {
    var secondes = 5;
    var annule = false;
    var elCompte = document.getElementById('fin-compte');
    var btnRester = document.getElementById('btn-rester');
    function tick() {
      if (annule) return;
      if (secondes <= 0) {
        window.location.href = '../../../index.html';
        return;
      }
      elCompte.textContent = 'Retour à la carte dans ' + secondes + 's…';
      secondes--;
      setTimeout(tick, 1000);
    }
    tick();
    btnRester.addEventListener('click', function () {
      annule = true;
      elCompte.textContent = 'D\'accord, prends ton temps ici 🙂';
    });
  }

  var tirage = melanger(melanger(banqueQCM).slice(0, 2).concat(melanger(banqueTexte).slice(0, 2)));
  var reussies = {};
  var uneErreur = false;
  var conteneur = document.getElementById('questions');

  function marquerTente() {
    if (localStorage.getItem(keyTente) !== 'oui') {
      localStorage.setItem(keyTente, 'oui');
    }
  }

  function verifierTout() {
    if (Object.keys(reussies).length === tirage.length) {
      localStorage.setItem(keyReussi, 'oui');
      if (!uneErreur) localStorage.setItem(keySansFaute, 'oui');
      brevetReussiteJour();
      document.getElementById('fin').classList.add('visible');
      brevetConfetti();
      brevetSon(true);
      sessionStorage.setItem('brevet2027_arrivee', idCours);
      demarrerRetourAuto();
    }
  }

  tirage.forEach(function (q, index) {
    var qid = 'q' + index;
    var div = document.createElement('div');
    div.className = 'question';

    var corpsHtml = q.choix
      ? '<div class="choix">' + q.choix.map(function (c) {
          return '<button class="reponse" data-correct="' + c.correct + '">' + c.texte + '</button>';
        }).join('') + '</div>'
      : '<div class="zone-texte"><input type="text" class="champ-reponse" placeholder="Ta réponse"><button class="btn-valider">Valider</button></div>';

    div.innerHTML =
      '<h2>Question ' + (index + 1) + '</h2>' +
      '<p class="enonce">' + q.enonce + '</p>' +
      corpsHtml +
      '<p class="feedback"></p>' +
      '<div class="aides">' +
      '<button class="btn-aide" data-niveau="1">Aide</button>' +
      '<div class="aide-texte" data-niveau="1">' + q.aide1 + '</div>' +
      '<button class="btn-aide" data-niveau="2">Aide supplémentaire</button>' +
      '<div class="aide-texte" data-niveau="2">' + q.aide2 + '</div>' +
      '<button class="btn-voir-reponse">Voir la réponse</button>' +
      '</div>';

    conteneur.appendChild(div);

    var feedback = div.querySelector('.feedback');

    function marquerReussi() {
      feedback.textContent = 'Bravo ✅';
      feedback.className = 'feedback ok';
      reussies[qid] = true;
      div.querySelector('.aides').style.display = 'none';
      brevetSon(true);
      verifierTout();
    }

    function marquerRate() {
      feedback.textContent = 'Presque, réessaie';
      feedback.className = 'feedback non';
      uneErreur = true;
      brevetErreur();
      brevetSon(false);
    }

    function marquerRevele() {
      feedback.textContent = 'Réponse révélée 💡';
      feedback.className = 'feedback revele';
      reussies[qid] = true;
      uneErreur = true;
      div.querySelector('.aides').style.display = 'none';
      verifierTout();
    }

    if (q.choix) {
      div.querySelectorAll('.reponse').forEach(function (btn) {
        btn.addEventListener('click', function () {
          marquerTente();
          div.querySelectorAll('.reponse').forEach(function (b) {
            b.classList.remove('correcte-select', 'fausse-select');
          });
          if (btn.dataset.correct === 'true') {
            btn.classList.add('correcte-select');
            marquerReussi();
          } else {
            btn.classList.add('fausse-select');
            marquerRate();
          }
        });
      });
    } else {
      var champ = div.querySelector('.champ-reponse');
      var btnValider = div.querySelector('.btn-valider');
      var accepteesNorm = q.reponses.map(normaliser);

      function valider() {
        marquerTente();
        champ.classList.remove('correcte', 'fausse');
        if (accepteesNorm.indexOf(normaliser(champ.value)) !== -1) {
          champ.classList.add('correcte');
          marquerReussi();
        } else {
          champ.classList.add('fausse');
          marquerRate();
        }
      }

      btnValider.addEventListener('click', valider);
      champ.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') valider();
      });
    }

    div.querySelectorAll('.btn-aide').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var niveau = btn.dataset.niveau;
        div.querySelector('.aide-texte[data-niveau="' + niveau + '"]').classList.add('visible');
        if (niveau === '1') {
          var aide2 = div.querySelector('.btn-aide[data-niveau="2"]');
          if (aide2) aide2.style.display = 'inline-flex';
        }
        if (niveau === '2') {
          var btnVoir = div.querySelector('.btn-voir-reponse');
          if (btnVoir) btnVoir.style.display = 'inline-flex';
        }
      });
    });

    var btnVoirReponse = div.querySelector('.btn-voir-reponse');
    if (btnVoirReponse) {
      btnVoirReponse.addEventListener('click', function () {
        if (q.choix) {
          div.querySelectorAll('.reponse').forEach(function (b) {
            b.classList.remove('correcte-select', 'fausse-select');
            b.disabled = true;
            if (b.dataset.correct === 'true') b.classList.add('correcte-select');
          });
        } else {
          var champReponse = div.querySelector('.champ-reponse');
          champReponse.value = q.reponses[0];
          champReponse.classList.remove('fausse');
          champReponse.classList.add('correcte');
          champReponse.disabled = true;
          div.querySelector('.btn-valider').disabled = true;
        }
        marquerRevele();
      });
    }
  });
</script>
</body>
</html>
