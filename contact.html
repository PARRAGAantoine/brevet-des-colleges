<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact — Brevet Sprint 2027</title>
<style>
:root{--bg:#0d1418;--card:#16222a;--border:#243442;--text:#e0e6ed;--muted:#94a3b8;--blue:#38bdf8}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(13,20,24,.95);backdrop-filter:blur(8px);z-index:10}
a{color:var(--blue);text-decoration:none;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 18px;border-radius:10px;border:1px solid var(--border);color:var(--text);font-size:.95rem;background:var(--card);font-weight:700;cursor:pointer}
.container{max-width:520px;margin:0 auto;padding:48px 16px;text-align:center}
.icone{font-size:3rem}
h1{font-size:1.5rem;color:#fff;margin:16px 0 10px}
p{color:var(--muted);margin-bottom:24px}
.mail{display:inline-flex;min-height:48px;align-items:center;justify-content:center;padding:12px 20px;border-radius:10px;background:var(--card);border:1px solid var(--blue);color:var(--blue);font-weight:700;font-size:1.05rem}
</style>
</head>
<body>
<div class="top">
  <a class="btn" href="index.html">← Accueil</a>
</div>
<div class="container">
  <div class="icone">✉️</div>
  <h1>Une question, un souci ?</h1>
  <p>Écris-moi directement, je réponds moi-même.</p>
  <a class="mail" href="mailto:parraga.antoine@gmail.com">parraga.antoine@gmail.com</a>
</div>
</body>
</html>
