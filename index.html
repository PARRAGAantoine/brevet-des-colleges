<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brevet Sprint 2027</title>
<style>
:root{--bg:#0d1418;--card:#16222a;--border:#243442;--text:#e0e6ed;--muted:#94a3b8;--blue:#38bdf8;--yellow:#fbbf24;--red:#f87171;--green:#4ade80;--violet:#a78bfa}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;color:var(--text);line-height:1.7;min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;
  background:
    radial-gradient(ellipse at 20% 15%, rgba(74,222,128,.14), transparent 38%),
    radial-gradient(ellipse at 80% 20%, rgba(56,189,248,.14), transparent 38%),
    radial-gradient(ellipse at 22% 82%, rgba(251,191,36,.14), transparent 38%),
    radial-gradient(ellipse at 80% 85%, rgba(167,139,250,.14), transparent 38%),
    linear-gradient(180deg, #0f1b16, #0c1620 40%, #1a1710 70%, #160f1e)
}
.etincelle-fond{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;box-shadow:0 0 5px #fff;animation:scintille-fond 3s ease-in-out infinite;pointer-events:none}
@keyframes scintille-fond{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:.9;transform:scale(1.3)}}
.nuage-fond{position:absolute;font-size:1.8rem;opacity:.35;pointer-events:none;animation:derive-fond 18s ease-in-out infinite}
@keyframes derive-fond{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}

.wrap{max-width:420px;width:100%;text-align:center;position:relative;z-index:2}
.halo-logo{position:absolute;left:50%;top:38px;transform:translateX(-50%);width:160px;height:160px;border-radius:50%;background:radial-gradient(circle, rgba(56,189,248,.35), transparent 70%);filter:blur(6px);animation:respire-halo 3.4s ease-in-out infinite}
@keyframes respire-halo{0%,100%{opacity:.6;transform:translateX(-50%) scale(.94)}50%{opacity:1;transform:translateX(-50%) scale(1.06)}}
.logo{position:relative;font-size:4.5rem;display:inline-block;animation:flotter 3s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
@keyframes flotter{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{font-size:1.6rem;color:#fff;margin:20px 0 8px}
p.slogan{color:var(--muted);font-size:1rem;margin-bottom:20px}

.retour{display:none;align-items:center;justify-content:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:999px;padding:10px 18px;margin:0 auto 24px;font-size:.85rem;color:var(--text);font-weight:700;width:fit-content}
.retour.visible{display:inline-flex}

.actions{display:flex;flex-direction:column;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 20px;border-radius:10px;border:1px solid var(--border);color:var(--text);font-size:1rem;background:var(--card);font-weight:700;cursor:pointer;text-decoration:none}
.btn-primary{background:linear-gradient(135deg,var(--blue),#0ea5e9);color:#04202e;border-color:var(--blue);box-shadow:0 0 18px rgba(56,189,248,.4)}
</style>
</head>
<body>
<div class="wrap">
  <div class="halo-logo"></div>
  <span class="logo">📖</span>
  <h1>Brevet Sprint 2027</h1>
  <p class="slogan">Un cours. Un exercice. Un progrès.</p>
  <div class="retour" id="retour"></div>
  <div class="actions">
    <a class="btn btn-primary" href="matieres.html">🗺️ Accès matières</a>
    <a class="btn" href="contact.html">✉️ Me contacter</a>
  </div>
</div>
<script>
  // Décor : nuages + étincelles réparties sur tout l'écran
  var positions = [[8,14],[85,10],[12,80],[88,78],[50,6]];
  positions.forEach(function (p, i) {
    var n = document.createElement('span');
    n.className = 'nuage-fond';
    n.textContent = '☁️';
    n.style.left = p[0] + 'vw';
    n.style.top = p[1] + 'vh';
    n.style.animationDelay = (i * 2.5) + 's';
    document.body.appendChild(n);
  });
  [[20,30],[75,25],[30,70],[70,65],[50,45],[15,55]].forEach(function (p, i) {
    var s = document.createElement('span');
    s.className = 'etincelle-fond';
    s.style.left = p[0] + 'vw';
    s.style.top = p[1] + 'vh';
    s.style.animationDelay = (i * 0.7) + 's';
    document.body.appendChild(s);
  });

  // Accueil personnalisé si l'élève a déjà de la progression (sans rien modifier au localStorage)
  var coffres = Object.keys(localStorage).filter(function (k) {
    return /^brevet2027_exo_.*_reussi$/.test(k) && localStorage.getItem(k) === 'oui';
  }).length;
  var streakCompte = parseInt(localStorage.getItem('brevet2027_streak_compte') || '0', 10);

  if (coffres > 0 || streakCompte > 0) {
    var morceaux = [];
    if (streakCompte > 0) morceaux.push('🔥 ' + streakCompte + ' jour' + (streakCompte > 1 ? 's' : '') + ' de suite');
    if (coffres > 0) morceaux.push('📦 ' + coffres + ' coffre' + (coffres > 1 ? 's' : '') + ' ouvert' + (coffres > 1 ? 's' : ''));
    var elRetour = document.getElementById('retour');
    elRetour.textContent = morceaux.join(' · ') + ' — bon retour !';
    elRetour.classList.add('visible');
  }
</script>
</body>
</html>
