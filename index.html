<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brevet Sprint 2027</title>
<style>
:root{--bg:#0d1418;--card:#16222a;--border:#243442;--text:#e0e6ed;--muted:#94a3b8;--blue:#38bdf8;--yellow:#fbbf24;--red:#f87171;--green:#4ade80}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{max-width:420px;width:100%;text-align:center}
.logo{font-size:4.5rem;display:inline-block;animation:flotter 3s ease-in-out infinite}
@keyframes flotter{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
h1{font-size:1.6rem;color:#fff;margin:20px 0 8px}
p.slogan{color:var(--muted);font-size:1rem;margin-bottom:36px}
.actions{display:flex;flex-direction:column;gap:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:12px 20px;border-radius:10px;border:1px solid var(--border);color:var(--text);font-size:1rem;background:var(--card);font-weight:700;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--blue);color:#000;border-color:var(--blue)}
</style>
</head>
<body>
<div class="wrap">
  <span class="logo">📖</span>
  <h1>Brevet Sprint 2027</h1>
  <p class="slogan">Un cours. Un exercice. Un progrès.</p>
  <div class="actions">
    <a class="btn btn-primary" href="matieres.html">Accès matières</a>
    <a class="btn" href="contact.html">Me contacter</a>
  </div>
</div>
</body>
</html>
