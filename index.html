<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brevet Sprint</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f6f7fb;
        color: #172033;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(640px, 100%);
        padding: 30px;
        border-radius: 10px;
        background: #ffffff;
        border: 1px solid #dce2ea;
        box-shadow: 0 18px 40px rgba(31, 45, 61, 0.12);
      }

      h1 {
        margin: 0 0 10px;
        font-size: clamp(2.2rem, 8vw, 3.6rem);
        line-height: 1;
      }

      p {
        margin: 0 0 12px;
        line-height: 1.55;
      }

      .muted {
        color: #667085;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        margin-top: 14px;
        padding: 0 18px;
        border-radius: 8px;
        background: #256d85;
        color: #fff;
        font-weight: 800;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Brevet Sprint</h1>
      <p id="status">Préparation de la dernière version...</p>
      <p class="muted">Cette page ouvre l'application et évite de rester bloqué sur une ancienne version du navigateur.</p>
      <a id="openApp" href="app-brevet/?v=20260705">Ouvrir l'application</a>
    </main>

    <script>
      const APP_URL = "app-brevet/?v=20260705";

      async function clearOldTechnicalCache() {
        if ("serviceWorker" in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map((registration) => registration.unregister()));
        }
        if ("caches" in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => caches.delete(key)));
        }
      }

      async function openLatestApp() {
        const status = document.getElementById("status");
        const link = document.getElementById("openApp");
        link.href = APP_URL;
        try {
          await clearOldTechnicalCache();
          status.textContent = "Dernière version prête. Ouverture de l'application...";
        } catch (error) {
          status.textContent = "Ouverture de l'application. Si une ancienne version apparaît, reviens sur cette page.";
        }
        window.setTimeout(() => {
          window.location.replace(APP_URL);
        }, 450);
      }

      openLatestApp();
    </script>
  </body>
</html>
